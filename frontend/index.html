<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Dance Avatar Frontend</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- 3D & Retargeting 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/kalidokit@1.1.5/dist/kalidokit.umd.js"></script>
</head>
<body>

  <div id="ui-container">
    <h3>아이돌 안무 3D 변환기</h3>
    <input type="text" id="backend-url" placeholder="백엔드 URL (비우면 같은 출처)">
    <input type="password" id="api-key" placeholder="API 키 (서버에 API_KEYS 설정시 필수)">
    <input type="text" id="youtube-url" placeholder="유튜브 안무 영상 URL 입력">
    <div style="display:flex;gap:6px;margin-top:6px">
      <select id="target" style="flex:1;padding:10px" title="추적 대상 (여러 명일 때)">
        <option value="auto">대상: 자동(1명 전제)</option>
        <option value="left">대상: 화면 왼쪽 사람</option>
        <option value="center">대상: 중앙 사람</option>
        <option value="right">대상: 화면 오른쪽 사람</option>
        <option value="face">대상: 얼굴사진으로 지정</option>
      </select>
      <label style="flex:1;font-size:12px">기준 얼굴사진<input type="file" id="ref-photo" accept="image/*" style="padding:4px"></label>
    </div>
    <div style="display:flex;gap:6px;margin-top:6px">
      <select id="render" style="flex:1;padding:10px" title="출력 방식 (AI 영상은 참고용)">
        <option value="avatar">출력: 3D 아바타</option>
        <option value="ref">출력: 아바타 + 참고 영상</option>
      </select>
      <label style="flex:1;font-size:12px">캐릭터 사진<input type="file" id="char-photo" accept="image/*" style="padding:4px"></label>
    </div>
    <div id="genvideo-box" style="display:none;margin-top:8px">
      <div style="font-size:12px;color:#ccc;margin-bottom:4px">참고 영상 (AI 생성, 대조용)</div>
      <video id="genvideo" controls playsinline style="width:100%;border-radius:6px"></video>
    </div>
    <div id="audio-box" style="display:none;margin-top:8px">
      <audio id="dance-audio" controls preload="auto" style="width:100%"></audio>
    </div>
    <details style="margin-top:8px;font-size:12px;color:#ccc">
      <summary style="cursor:pointer">모드 설명</summary>
      <div style="margin-top:4px;line-height:1.6">
        원본 33관절을 그대로 받아 브라우저에서 Kalidokit으로 변환합니다.<br>
        대상 지정(여러 명일 때)·참고 영상·노래는 그대로 유지됩니다.
      </div>
    </details>
    <div style="display:flex;gap:6px;margin-top:6px">
      <button id="bvh-btn" style="flex:1" onclick="downloadBVH()" disabled>BVH 저장</button>
    </div>
    <button onclick="processYoutube()">안무 따기</button>
    <button id="replay-btn" onclick="replayMotion()" disabled>안무 재생</button>
    <div id="loading">백엔드에서 모션 추출 중... (약 10~20초 소요)</div>
    <progress id="progress" max="100" value="0"></progress>
  </div>

  <div id="canvas-container"></div>

  <script src="js/config.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/api.js"></script>
  <script src="js/player.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
