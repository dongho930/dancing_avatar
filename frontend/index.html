<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Dance Avatar Frontend</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- 3D & Retargeting 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/kalidokit@1.1.5/dist/kalidokit.umd.js"></script>
</head>
<body>

  <div id="ui-container">
    <h3>아이돌 안무 3D 변환기</h3>
    <input type="text" id="backend-url" placeholder="백엔드 URL (비우면 같은 출처)">
    <input type="password" id="api-key" placeholder="API 키 (서버에 API_KEYS 설정시 필수)">
    <input type="text" id="youtube-url" placeholder="유튜브 안무 영상 URL 입력">
    <div id="preview-box" style="display:none;margin-top:8px">
      <div style="font-size:12px;color:#ccc;margin-bottom:4px">첫 화면에서 추적할 사람을 클릭하세요 <span id="preview-status"></span></div>
      <div id="preview-wrap" style="position:relative;width:100%;border-radius:6px;overflow:hidden">
        <img id="preview-img" style="width:100%;display:block" alt="첫 프레임 미리보기">
      </div>
    </div>
    <div style="display:flex;gap:6px;margin-top:6px">
      <select id="render" style="flex:1;padding:10px" title="출력 방식 (AI 영상은 참고용)">
        <option value="avatar">출력: 3D 아바타</option>
        <option value="ref">출력: 아바타 + 참고 영상</option>
      </select>
    </div>
    <div id="genvideo-box" style="display:none;margin-top:8px">
      <div style="font-size:12px;color:#ccc;margin-bottom:4px">참고 영상 (AI 생성, 대조용)</div>
      <video id="genvideo" controls playsinline style="width:100%;border-radius:6px"></video>
    </div>
    <div id="audio-box" style="display:none;margin-top:8px">
      <audio id="dance-audio" controls preload="auto" style="width:100%"></audio>
    </div>
    <details style="margin-top:8px;font-size:12px;color:#ccc">
      <summary style="cursor:pointer">모드 설명</summary>
      <div style="margin-top:4px;line-height:1.6">
        원본 33관절을 그대로 받아 브라우저에서 Kalidokit으로 변환합니다.<br>
        대상 지정(여러 명일 때)·참고 영상·노래는 그대로 유지됩니다.
      </div>
    </details>
    <div style="display:flex;gap:6px;margin-top:6px">
      <button id="bvh-btn" style="flex:1" onclick="downloadBVH()" disabled>BVH 저장</button>
    </div>
    <div style="display:flex;gap:6px;margin-top:6px">
      <button style="flex:1" onclick="requestPreview()">첫 화면 미리보기</button>
      <button style="flex:2" onclick="processYoutube()">안무 따기</button>
    </div>
    <button id="replay-btn" onclick="replayMotion()" disabled>안무 재생</button>
    <div id="loading">백엔드에서 모션 추출 중... (약 10~20초 소요)</div>
    <progress id="progress" max="100" value="0"></progress>
  </div>

  <div id="canvas-container"></div>

  <script src="js/config.js?v=20260907"></script>
  <script src="js/scene.js?v=20260908d"></script>
  <script src="js/api.js?v=20260907"></script>
  <script src="js/player.js?v=20260908a"></script>
  <script src="js/ui.js?v=20260907"></script>
</body>
</html>
